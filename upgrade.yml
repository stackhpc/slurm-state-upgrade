
- hosts: control
  become: true
  gather_facts: false
  tags: slurm-convert
  vars:
    # slurmupgrade_intermediate_ver:
    slurmupgrade_ctld_marker: "/var/lib/state/slurm-{{ slurmupgrade_intermediate_ver }}-ctld-converted"
    slurmupgrade_image_name: "slurm-{{ slurmupgrade_intermediate_ver }}"
    slurmupgrade_image_context: "{{ playbook_dir }}/image"
    # slurmupdate_ohpc_repo_url:
    # slurmupdate_ohpc_update_url:
    

  tasks:
    - name: Check whether conversion already completed
      ansible.builtin.stat:
        path: "{{ slurmupgrade_ctld_marker }}"
      register: _ctld_marker

    - name: Skip host if conversion already completed
      ansible.builtin.meta: end_host
      when: _ctld_marker.stat.exists
    
    - name: Build container image
      containers.podman.podman_image:
        name: "{{ slurmupgrade_image_name }}"
        path: "{{ slurmupgrade_image_context }}"
        force: true
        build:
          extra_args: >-
            --secret id=ark_username,env=ARK_USERNAME
            --secret id=ark_password,env=ARK_PASSWORD
            --build-arg OHPC_REPO_URL={{ slurmupdate_ohpc_repo_url }}
            --build-arg OHPC_UPDATE_URL={{ slurmupdate_ohpc_update_url }}
            --build-arg SLURM_VERSION={{ slurmupgrade_intermediate_ver }}
            --runtime crun
      environment:
        ARK_USERNAME: "{{ ark_username }}"
        ARK_PASSWORD: "{{ ark_password }}"
      register: _img_build
      delegate_to: localhost
      become: false
      run_once: true
