
- hosts: control
  become: true
  gather_facts: false
  tags: slurm-convert
  vars:
    # slurmupgrade_intermediate_ver:
    slurmupgrade_ctld_marker: "/var/lib/state/slurm-{{ slurmupgrade_intermediate_ver }}-ctld-converted"
    slurmupgrade_image_name: "slurm-{{ slurmupgrade_intermediate_ver }}"
    slurmupgrade_image_context: "{{ playbook_dir }}/image"
    # slurmupgrade_ohpc_repo_url:
    # slurmupgrade_ohpc_update_url:
    slurmupgrade_image_archive: "{{ slurmupgrade_image_name }}.tar"
    

  tasks:
    - name: Check whether conversion already completed
      ansible.builtin.stat:
        path: "{{ slurmupgrade_ctld_marker }}"
      register: _ctld_marker

    - name: Skip host if conversion already completed
      ansible.builtin.meta: end_host
      when: _ctld_marker.stat.exists
    
    - import_tasks: tasks/image.yml
